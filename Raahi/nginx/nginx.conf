# Nginx reverse proxy + load balancer for Raahi.
# Round-robins across the three app instances. The X-Upstream header
# shows which instance served each request (useful to prove balancing).

upstream raahi_backend {
    server raahi1:8000;
    server raahi2:8000;
    server raahi3:8000;
}

server {
    listen 80;

    # Static files collected by `collectstatic` into the shared volume
    location /static/ {
        alias /srv/static/;
        expires 7d;
    }

    # User uploads (avatars, post images)
    location /media/ {
        alias /srv/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://raahi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        add_header X-Upstream $upstream_addr always;
    }
}
