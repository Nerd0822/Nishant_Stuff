{% extends 'base.html' %}
{% load static %}

{% block map %}
  <div class="workspace-dashboard">
    <!-- LEFT COLUMN: Map & Route Tools Container -->
    <div class="dashboard-left-deck">
      <section id="main" class="glass-panel" x-data="{ directionsOpen: false }">
        <!-- Search Dock -->
        <div class="tools-dock">
          <div class="tools-group tools-search">
            <div class="input-with-icon">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="placeInput" name="place" placeholder="Search a destination..."
                     hx-post="/set-place/"
                     hx-trigger="keyup changed delay:500ms"
                     hx-target="#discoverBtn"
                     hx-swap="outerHTML" />
            </div>
            <button class="btn-primary" onclick="searchPlace()"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
            <button id="savePlaceBtn" class="btn-secondary" onclick="saveCurrentPlace()" disabled title="Search a destination first" style="opacity:0.4;pointer-events:none;">
              <i class="fa-solid fa-bookmark"></i><span class="save-label"> Save</span>
            </button>
          </div>
        </div>

        <!-- Directions Section -->
        <div id="directionsSection" class="tools-dock" style="display: none;">
          <button id="directionsBtn" class="btn-secondary" @click="directionsOpen = !directionsOpen">
            <i class="fa-solid" :class="directionsOpen ? 'fa-xmark' : 'fa-route'"></i>
            <span x-text="directionsOpen ? 'Hide Directions' : 'Get Directions'"></span>
          </button>

          <div id="routingInputs" class="tools-group tools-routing" x-show="directionsOpen" x-cloak>
            <div class="input-with-icon">
              <i class="fa-solid fa-location-dot"></i>
              <input type="text" id="startLocation" placeholder="Enter starting point..." />
            </div>
            <div class="routing-actions">
              <button class="btn-secondary" onclick="useCurrentLocation()" title="Use Current Location"><i class="fa-solid fa-location-crosshairs"></i></button>
              <button class="btn-primary" onclick="handleStartLocation()"><i class="fa-solid fa-route"></i> Show Route</button>
            </div>
          </div>
        </div>

        <div style="display: flex;">
          <!-- Drive Mode Toggle -->
          <div class="tools-dock">
            <button id="driveModeBtn" class="btn-secondary" onclick="toggleDriveMode()"><i class="fa-solid fa-car"></i> Enable Drive Mode</button>
          </div>

          <!-- Generate Itinerary -->
          <div class="tools-dock">
            <button class="btn-plan-itinerary" id="discoverBtn" onclick="requestItinerary()"><i class="fa-solid fa-calendar-plus"></i> Generate Smart Itinerary Plan</button>
          </div>
        </div>

        <!-- Route Info Panel -->
        <div id="routeInfoPanel" class="route-info-panel" style="display:none;">
          <div class="route-info-header">
            <span><i class="fa-solid fa-route"></i> Route Details</span>
            <button class="route-info-close" onclick="closeRoutePanel()" aria-label="Close">&times;</button>
          </div>
          <div class="route-info-body">
            <div id="routeSummary" class="route-summary"></div>
            <div id="routeInstructions" class="route-instructions"></div>
          </div>
        </div>

        <!-- Map -->
        <div class="map-viewport-wrapper">
          <div id="map"></div>
        </div>
      </section>
    </div>

    <!-- RIGHT COLUMN: AI Copilot -->
    <div class="dashboard-right-deck">
      <div class="chat-container glass-panel" x-data="chatState()">
        <div class="chat-header">
          <div class="chat-title-block">
            <div class="chat-avatar">
              <i class="fa-solid fa-robot"></i>
            </div>
            <div>
              <h2>Raahi Copilot</h2>
              <span class="chat-status">
                <span class="chat-status-dot"></span>
                Online
              </span>
            </div>
          </div>
          <div class="live-toggle">
            <span class="toggle-label">Live Track</span>
            <label class="switch">
              <input type="checkbox" id="liveModeToggle" />
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="chat-messages" id="chatMessages"
             hx-target="this" hx-swap="beforeend">
          <div class="message bot-bubble">
            <div class="bot-avatar-small">
              <i class="fa-solid fa-robot"></i>
            </div>
            <p>Hello! I'm monitoring your map session. Ask me to extract landmarks, calculate fuel breaks, or detail historical spots along the way.</p>
          </div>
        </div>

        <!-- Typing indicator -->
        <div class="typing-indicator" x-show="loading" x-cloak>
          <div class="bot-avatar-small"><i class="fa-solid fa-robot"></i></div>
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>

        <div class="chat-suggestions">
          <button class="chip-btn" onclick="fetchHotels()">🏨 Hotels</button>
          <button class="chip-btn" onclick="sendChipPrompt('Plan a full day itinerary for ' + (lastSearchedPlace || ''))">🗺️ Itinerary</button>
          <button class="chip-btn" onclick="sendChipPrompt('What are the best restaurants in ' + (lastSearchedPlace || '') + '?')">🍽️ Eateries</button>
          <button class="chip-btn" onclick="sendChipPrompt('What is the weather like in ' + (lastSearchedPlace || '') + '?')">🌤️ Weather</button>
        </div>

        <form class="chat-input"
              hx-post="/chat/"
              hx-target="#chatMessages"
              hx-swap="beforeend"
              @submit.prevent="submitMessage($el)">
          <input type="text" name="message" x-model="input" placeholder="Ask Raahi to optimize this journey..." />
          <button type="submit" class="chat-submit-btn" aria-label="Send query"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
      </div>
    </div>

    <button class="chat-edge-toggle" id="chatCollapseBtn" onclick="toggleChat()"><i class="fa-solid fa-chevron-left" id="chatCollapseIcon"></i></button>
  </div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('chatState', () => ({
    input: '',
    loading: false,
    submitMessage(el) {
      if (!this.input.trim()) return;
      this.loading = true;
      // Let HTMX handle the request; after swap we hide loading
      el.addEventListener('htmx:afterSwap', () => {
        this.loading = false;
        // Scroll to bottom
        const msgs = document.getElementById('chatMessages');
        if (msgs) msgs.scrollTop = msgs.scrollHeight;
      }, { once: true });
    }
  }));
});

document.getElementById("placeInput").addEventListener("keydown", function (e) {
  if (e.key === "Enter") searchPlace();
});
</script>
{% endblock %}
