{% load static django_htmx %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Raahi — Your adventure companion for road trips across India. Discover routes, plan itineraries, explore the open road.">
    <title>{% block title %}Raahi{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {# Animate.css (vendored) #}
    <link rel="stylesheet" href="{% static 'vendor/animatecss/animate.min.css' %}">

    {# Block to add individual <link> tags or external stylesheets per page #}
    {% block links %}{% endblock %}

    {# Block to add page-specific inline CSS or <style> tags #}
    {% block style %}{% endblock %}

    {# Anime.js (vendored) #}
    <script src="{% static 'vendor/animejs/anime.min.js' %}"></script>

    {# FormKit Auto-Animate (bundled pure vanilla JS, exposes window.autoAnimate) #}
    <script src="{% static 'js/vendor-auto-animate.js' %}"></script>

    {# htmx (vendored) #}
    <script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>

    {# Alpine.js (vendored, deferred so it starts after parsing) #}
    <script defer src="{% static 'vendor/alpinejs/cdn.min.js' %}"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' hx-boost="true">

    <header>
        <nav>
            <a href="{% url 'home' %}" class="nav-brand" aria-label="Raahi Home">
                {% include "icons/compass.html" %}
                Raahi
            </a>
            <div class="nav-links">
                <a href="{% url 'home' %}" class="{% if request.path == '/' %}active{% endif %}">Home</a>
                <a href="{% url 'map' %}" hx-boost="false" class="{% if request.path == '/map/' %}active{% endif %}">Map</a>
                <a href="{% url 'explore' %}" class="{% if request.path|slice:':9' == '/explore/' %}active{% endif %}">Explore</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' user.username %}" class="{% if request.path == '/accounts/'|add:user.username|add:'/' %}active{% endif %}">Profile</a>
                    <form method="post" action="{% url 'logout' %}" class="nav-logout-form">
                        {% csrf_token %}
                        <button type="submit" class="nav-btn">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="{% if request.path == '/accounts/login/' %}active{% endif %}">Log In</a>
                    <a href="{% url 'register' %}" class="{% if request.path == '/accounts/register/' %}active{% endif %}">Sign Up</a>
                {% endif %}
            </div>
            <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                <span class="theme-toggle-icon theme-toggle--sun" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </span>
                <span class="theme-toggle-icon theme-toggle--moon" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </span>
            </button>
        </nav>
    </header>

    <main>
        {% block main %}
        {% endblock %}
    </main>

    {# Block to add page-specific scripts or <script> tags #}
    {% block script %}{% endblock %}
    <script>
        (function () {
            var root = document.documentElement;
            var toggle = document.getElementById('theme-toggle');
            if (!toggle) return;

            // Determine initial theme: saved preference or system preference
            function getPreferredTheme() {
                var saved = localStorage.getItem('raahi-theme');
                if (saved) return saved;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            function applyTheme(theme) {
                root.setAttribute('data-theme', theme);
                localStorage.setItem('raahi-theme', theme);
            }

            applyTheme(getPreferredTheme());

            toggle.addEventListener('click', function () {
                var current = root.getAttribute('data-theme') || 'light';
                applyTheme(current === 'dark' ? 'light' : 'dark');
            });
        })();
    </script>
</body>
</html>
