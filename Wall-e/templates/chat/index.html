{% extends "base.html" %}
{% block title %}Wall-e — Chatbot{% endblock %}

{% block content %}
<div class="welcome-screen">
    <div class="welcome-logo">🤖</div>
    <h1>Wall-e</h1>
    <p class="welcome-tagline">Your local AI desktop assistant. Ask me anything!</p>
    <a href="{% url 'chat:new_chat' %}" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Start a new chat
    </a>
</div>
{% endblock %}
