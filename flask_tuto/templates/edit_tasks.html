{% extends "base.html" %}

{% block title %}EDIT{% endblock %}

{% block body %}
<h1>update tasks</h1>

<form action="/edit/{{ task.id }}" method="post">
    <input type="text" name="title" id="title" placeholder="enter the title" value="{{task.title}}">
    <br>
    <input type="text" name="content" id="content" placeholder="task details" value="{{task.content}}">
    <br>
    <button type="submit">EDIT</button>
</form>
{% endblock %}
